<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <!-- Original Vaalytics illustration: "Ember Coast" — a storm-lit cliff with a ruined spire above a dark sea.
       Not derived from Grinding Gear Games artwork. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a0b"/>
      <stop offset="0.35" stop-color="#2a1410"/>
      <stop offset="0.58" stop-color="#7a2f14"/>
      <stop offset="0.7" stop-color="#c2581c"/>
      <stop offset="0.78" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#0a0809"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.95"/>
      <stop offset="0.12" stop-color="#ff9a3d" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#b24414" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f0d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4a2014" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="0.25" stop-color="#160c0b"/>
      <stop offset="1" stop-color="#060506"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb466" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0703a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d0703a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d0703a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3a" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#ff8a3a" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#ffb070" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="600" height="800" fill="url(#sky)"/>
  <rect width="600" height="800" fill="url(#sun)"/>
  <circle cx="372" cy="498" r="34" fill="#ffd9a0" opacity="0.9" filter="url(#soft)"/>

  <!-- storm clouds, back to front -->
  <path d="M0 250 C80 210 150 260 230 228 C320 190 380 250 470 214 C530 192 570 214 600 200 L600 0 L0 0Z" fill="#120b0b"/>
  <path d="M0 330 C90 300 160 340 250 312 C330 288 400 330 480 300 C540 280 575 300 600 292 L600 220 C560 232 520 214 460 238 C380 270 320 214 236 246 C160 276 80 230 0 266Z" fill="url(#cloud)" opacity="0.9"/>
  <path d="M0 420 C70 398 140 430 230 410 C300 395 350 420 430 402 C500 386 560 404 600 398 L600 360 C540 372 480 350 420 372 C340 398 300 368 220 386 C140 404 70 380 0 392Z" fill="#5a2414" opacity="0.55"/>

  <!-- far headland -->
  <path d="M0 540 L40 528 L90 534 L150 512 L210 520 L250 506 L290 516 L330 524 L360 534 L0 560Z" fill="#2a120d" opacity="0.85"/>

  <!-- sea -->
  <rect y="548" width="600" height="252" fill="url(#sea)"/>
  <rect x="210" y="552" width="320" height="3" fill="url(#glint)"/>
  <rect x="250" y="566" width="230" height="2" fill="url(#glint)" opacity="0.7"/>
  <rect x="290" y="584" width="150" height="2" fill="url(#glint)" opacity="0.5"/>
  <rect x="310" y="606" width="100" height="1.5" fill="url(#glint)" opacity="0.35"/>

  <!-- main cliff with ruined spire -->
  <path d="M0 800 L0 470 L36 452 L58 462 L74 430 L96 424 L112 398 L128 404 L146 380 L170 386 L188 410 L214 420 L238 452 L262 470 L292 520 L318 560 L346 610 L380 680 L420 800Z" fill="#0d0809"/>
  <!-- spire / ruined chapel on the crag -->
  <path d="M120 404 L120 300 L126 300 L126 262 L131 222 L136 262 L136 300 L142 300 L142 330 L150 330 L150 386 L160 386 L160 356 L166 340 L172 356 L172 392 L120 404Z" fill="#0d0809"/>
  <path d="M128 318 L134 318 L134 334 L128 334Z M154 352 L158 352 L158 364 L154 364Z" fill="#ff9a3d" opacity="0.55"/>
  <!-- broken arch -->
  <path d="M176 392 L176 368 C180 352 196 352 200 368 L200 404 L196 404 L196 372 C193 362 183 362 180 372 L180 396Z" fill="#0d0809"/>
  <!-- rim light on cliff edge facing the sun -->
  <path d="M146 380 L170 386 L188 410 L214 420 L238 452 L262 470 L292 520 L318 560 L346 610 L380 680" fill="none" stroke="url(#rim)" stroke-width="2" opacity="0.8"/>

  <!-- low mist over the water -->
  <rect y="560" width="600" height="70" fill="url(#mist)"/>

  <!-- embers (static) -->
  <g fill="#ffb466">
    <circle cx="420" cy="430" r="1.6" opacity="0.8"/>
    <circle cx="452" cy="372" r="1.1" opacity="0.6"/>
    <circle cx="388" cy="350" r="1.3" opacity="0.5"/>
    <circle cx="500" cy="452" r="1" opacity="0.6"/>
    <circle cx="260" cy="340" r="1.2" opacity="0.4"/>
    <circle cx="540" cy="390" r="1.4" opacity="0.5"/>
    <circle cx="330" cy="300" r="0.9" opacity="0.45"/>
    <circle cx="468" cy="520" r="1" opacity="0.5"/>
  </g>

  <!-- vignette -->
  <radialGradient id="vig" cx="0.5" cy="0.55" r="0.75">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
  </radialGradient>
  <rect width="600" height="800" fill="url(#vig)"/>
</svg>
